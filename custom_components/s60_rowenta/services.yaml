get_schedules:
  target:
    entity:
      integration: s60_rowenta
      domain: vacuum

set_schedule:
  target:
    entity:
      integration: s60_rowenta
      domain: vacuum
  fields:
    schedule:
      example: "Mañana"
      selector:
        text:
    name:
      example: "Limpieza matutina"
      selector:
        text:
    start:
      example: "09:00"
      selector:
        time:
    days:
      example: ["mon", "wed", "fri"]
      selector:
        select:
          multiple: true
          translation_key: day
          options: [mon, tue, wed, thu, fri, sat, sun]
    mode:
      selector:
        select:
          translation_key: sched_mode
          options: [smart_cleaning, auto_cleaning, wall_follow, small_room]
    power:
      selector:
        select:
          translation_key: sched_power
          options: [silent, normal, strong]
    enabled:
      selector:
        boolean:

delete_schedule:
  target:
    entity:
      integration: s60_rowenta
      domain: vacuum
  fields:
    schedule:
      required: true
      example: "Mañana"
      selector:
        text: